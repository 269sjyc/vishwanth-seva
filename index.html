<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishwanath Seva</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: transparent;
  overflow-x: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
}

/* ── Background ── */
.bg-cover {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: url('/bus.jpeg') center center / cover no-repeat;
  z-index: -1;
}

/* ── Prayer Flags ── */
.flags-rope {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  z-index: 10;
  overflow: hidden;
  pointer-events: none;
}
.rope-line {
  position: absolute;
  top: 10px; left: 0; right: 0;
  height: 2px;
  background: rgba(180,120,40,0.7);
}
.flags-wrap {
  position: absolute;
  top: 6px; left: 0;
  display: flex;
  gap: 0;
  animation: flagsScroll 20s linear infinite;
}
@keyframes flagsScroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.flag {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 28px solid red;
  margin: 0 2px;
}
.flag:nth-child(5n+1) { border-top-color: #e53935; }
.flag:nth-child(5n+2) { border-top-color: #fdd835; }
.flag:nth-child(5n+3) { border-top-color: #43a047; }
.flag:nth-child(5n+4) { border-top-color: #1e88e5; }
.flag:nth-child(5n+5) { border-top-color: #f5f5f5; }

/* ── Clock ── */
#clock {
  position: fixed;
  top: 14px; left: 16px;
  z-index: 20;
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  letter-spacing: 0.04em;
}

/* ── Hidden YT frame ── */
#yt-player {
  position: fixed;
  width: 2px; height: 2px;
  opacity: 0.01;
  pointer-events: none;
}

/* ── Playlist Tabs ── */
#tabs {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  z-index: 30;
}
.tab-btn {
  padding: 12px 26px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 600;
  background: rgba(255,255,255,0.18);
  color: #fff;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 4px 18px rgba(0,0,0,0.25);
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  min-height: 44px;
  white-space: nowrap;
}
.tab-btn:hover {
  background: rgba(255,200,50,0.32);
  transform: scale(1.05);
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
}
.tab-btn.active {
  background: rgba(255,180,0,0.55);
  color: #fff;
  box-shadow: 0 6px 24px rgba(255,160,0,0.45);
}

/* ── Queue Panel ── */
#queue-panel {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  width: min(560px, 96vw);
  max-height: 340px;
  background: rgba(18,18,28,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 18px;
  overflow-y: auto;
  z-index: 40;
  padding: 10px 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,180,0,0.4) transparent;
}
#queue-panel.open {
  opacity: 1;
  pointer-events: all;
  transform: translateX(-50%) translateY(0);
}
.queue-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  border-radius: 10px;
  transition: background 0.15s;
  color: #eee;
  font-size: 0.87rem;
}
.queue-item:hover { background: rgba(255,255,255,0.08); }
.queue-item.playing { background: rgba(255,180,0,0.18); color: #ffd54f; }
.queue-num {
  min-width: 24px;
  text-align: right;
  font-size: 0.78rem;
  color: #888;
}
.queue-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-thumb {
  width: 44px; height: 30px;
  object-fit: cover;
  border-radius: 5px;
  background: #bcbaba;
  flex-shrink: 0;
}

/* ── Music Player Bar ── */
#player-bar {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: min(500px, 96vw);
  background: rgba(12,12,22,0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 22px;
  padding: 6px 12px 8px;
  z-index: 50;
  box-shadow: 0 8px 32px rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.08);
}

/* Thumbnail */
.player-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}
#thumb-wrap {
  position: relative;
  flex-shrink: 0;
}
#thumb {
  width: 38px; height: 38px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,180,0,0.5);
  background: #222;
}
#thumb.spin {
  animation: spinThumb 4s linear infinite;
}
@keyframes spinThumb {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
/* Track info */
.track-info {
  flex: 1;
  overflow: hidden;
}
#track-name {
  font-size: 0.82rem;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#channel-name {
  font-size: 0.68rem;
  color: #aaa;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

/* Controls row */
.controls-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-bottom: 2px;
}
.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #ccc;
  font-size: 1rem;
  padding: 6px;
  border-radius: 50%;
  min-width: 30px; min-height: 30px;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
.ctrl-btn.active { color: #ffd54f; }
#play-btn {
  background: #ffb300;
  color: #111;
  font-size: 1.15rem;
  min-width: 38px; min-height: 38px;
  border-radius: 50%;
  box-shadow: 0 3px 14px rgba(255,180,0,0.45);
  transition: background 0.15s, transform 0.1s;
}
#play-btn:hover { background: #ffc107; transform: scale(1.07); }
#play-btn .spinner-ring {
  display: none;
  width: 22px; height: 22px;
  border: 3px solid rgba(0,0,0,0.2);
  border-top-color: #111;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
#play-btn.buffering .btn-icon { display: none; }
#play-btn.buffering .spinner-ring { display: block; }
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Progress row */
.progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
  gap: 5px;}
.time-label {
  font-size: 0.68rem;
  color: #999;
  white-space: nowrap;
  min-width: 28px;
}
#progress {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.15);
  outline: none;
  cursor: pointer;
}
#progress::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #ffb300;
  cursor: pointer;
  margin-top: -5px;
}
#progress::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
}

/* Volume row */
.vol-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  justify-content: flex-end;
}
#mute-btn { font-size: 1rem; }
#vol-slider {
  -webkit-appearance: none;
  width: 60px; height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.15);
  outline: none;
  cursor: pointer;
}
#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #ffb300;
  cursor: pointer;
}

/* ── Mobile ── */
@media (max-width: 480px) {
  #player-bar {
    width: 100vw;
    bottom: 0;
    border-radius: 18px 18px 0 0;
    left: 0;
    transform: none;
  }
  #queue-panel {
    width: 100vw;
    left: 0;
    transform: translateY(20px);
    border-radius: 18px 18px 0 0;
    bottom: 105px;
  }
  #queue-panel.open {
    transform: translateY(0);
  }
  .vol-row #vol-slider { display: none; }
  .ctrl-btn { min-width: 44px; min-height: 44px; }
}

/* ── JAM ── */
#jam-btn {
  background: linear-gradient(135deg, #ff6b35, #f7c59f);
  color: #1a0800;
  font-weight: 700;
  font-size: 0.82rem;
  padding: 6px 14px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  min-height: 34px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 10px rgba(255,107,53,0.4);
  white-space: nowrap;
  flex-shrink: 0;
}
#jam-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(255,107,53,0.6); }
#jam-btn.active {
  background: linear-gradient(135deg, #43a047, #a5d6a7);
  box-shadow: 0 2px 10px rgba(67,160,71,0.5);
}

#jam-status {
  position: fixed;
  top: 14px;
  right: 16px;
  background: rgba(12,12,22,0.85);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 0.78rem;
  padding: 5px 12px;
  border-radius: 999px;
  z-index: 100;
  display: none;
  align-items: center;
  gap: 6px;
  border: 1px solid rgba(255,255,255,0.1);
}
#jam-status.visible { display: flex; }
#jam-status .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #43a047;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.85); }
}

#jam-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#jam-modal.open { display: flex; }
#jam-modal-box {
  background: rgba(18,18,28,0.98);
  border: 1px solid rgba(255,180,0,0.3);
  border-radius: 20px;
  padding: 28px 24px;
  width: min(420px, 100%);
  color: #fff;
  text-align: center;
}
#jam-modal-box h2 {
  font-size: 1.4rem;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #ff6b35, #ffd54f);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#jam-modal-box p { color: #aaa; font-size: 0.88rem; margin-bottom: 18px; }
#jam-link-box {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.78rem;
  color: #ffd54f;
  word-break: break-all;
  margin-bottom: 14px;
  text-align: left;
  cursor: pointer;
  user-select: all;
}
#jam-copy-btn {
  background: #ffb300;
  color: #111;
  border: none;
  border-radius: 999px;
  padding: 10px 28px;
  font-weight: 700;
  cursor: pointer;
  font-size: 0.95rem;
  margin-bottom: 10px;
  width: 100%;
  transition: background 0.15s;
}
#jam-copy-btn:hover { background: #ffc107; }
#jam-close-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.2);
  color: #aaa;
  border-radius: 999px;
  padding: 8px 20px;
  cursor: pointer;
  font-size: 0.85rem;
  width: 100%;
  margin-top: 4px;
}
#jam-close-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

/* ══════════════════════════════════════
   WEATHER + BUS SCENE
══════════════════════════════════════ */

/* Weather overlay - sits above bg, below everything else */
#weather-scene {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
  transition: background 3s ease;
}

/* Sky tint overlays per weather type */
#weather-scene.sunny   { background: linear-gradient(180deg, rgba(255,200,50,0.08) 0%, transparent 60%); }
#weather-scene.cloudy  { background: linear-gradient(180deg, rgba(80,90,110,0.35) 0%, transparent 70%); }
#weather-scene.rainy   { background: linear-gradient(180deg, rgba(40,55,80,0.55) 0%, rgba(30,40,60,0.3) 100%); }
#weather-scene.thunder { background: linear-gradient(180deg, rgba(20,20,40,0.7) 0%, rgba(40,30,60,0.4) 100%); }
#weather-scene.foggy   { background: linear-gradient(180deg, rgba(180,180,190,0.4) 0%, rgba(160,165,175,0.3) 100%); }
#weather-scene.snowy   { background: linear-gradient(180deg, rgba(200,220,240,0.3) 0%, transparent 80%); }

/* ── SUN ── */
#sun {
  position: absolute;
  top: 8%; right: 12%;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe066 30%, #ffb300 70%, transparent 100%);
  box-shadow: 0 0 60px 20px rgba(255,210,50,0.5), 0 0 120px 50px rgba(255,180,0,0.2);
  opacity: 0;
  transition: opacity 2s ease;
  animation: sunPulse 4s ease-in-out infinite;
}
#sun.visible { opacity: 1; }
@keyframes sunPulse {
  0%,100% { box-shadow: 0 0 60px 20px rgba(255,210,50,0.5), 0 0 120px 50px rgba(255,180,0,0.2); }
  50%      { box-shadow: 0 0 80px 30px rgba(255,220,60,0.7), 0 0 160px 70px rgba(255,190,0,0.3); }
}
/* Sun rays */
.sun-ray {
  position: absolute;
  top: 50%; left: 50%;
  width: 200px; height: 2px;
  background: linear-gradient(90deg, rgba(255,220,80,0.6), transparent);
  transform-origin: 0 50%;
  border-radius: 2px;
}

/* ── CLOUDS ── */
.cloud {
  position: absolute;
  background: rgba(255,255,255,0.85);
  border-radius: 50px;
  opacity: 0;
  transition: opacity 2s ease;
  animation: cloudDrift linear infinite;
}
.cloud.visible { opacity: 1; }
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud.dark { background: rgba(90,100,120,0.75); }
@keyframes cloudDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(calc(110vw + 300px)); }
}

/* ── RAIN ── */
#rain-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.5s ease;
}
#rain-container.visible { opacity: 1; }
.raindrop {
  position: absolute;
  top: -20px;
  width: 1.5px;
  background: linear-gradient(180deg, transparent, rgba(174,214,241,0.8));
  border-radius: 2px;
  animation: rainFall linear infinite;
}
@keyframes rainFall {
  to { transform: translateY(110vh) translateX(-30px); opacity: 0; }
}

/* Heavy rain extra splash */
.rain-splash {
  position: absolute;
  bottom: 0;
  width: 4px; height: 2px;
  background: rgba(174,214,241,0.5);
  border-radius: 50%;
  animation: splash 0.3s ease-out forwards;
}
@keyframes splash {
  0%   { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(3); opacity: 0; }
}

/* ── SNOW ── */
#snow-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.5s ease;
}
#snow-container.visible { opacity: 1; }
.snowflake {
  position: absolute;
  top: -10px;
  color: white;
  font-size: 1rem;
  animation: snowFall linear infinite;
  user-select: none;
}
@keyframes snowFall {
  to { transform: translateY(110vh) translateX(40px) rotate(360deg); opacity: 0.2; }
}

/* ── LIGHTNING ── */
#lightning {
  position: fixed;
  inset: 0;
  background: rgba(220,230,255,0.9);
  z-index: 2;
  opacity: 0;
  pointer-events: none;
}

/* ── FOG ── */
#fog-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 3s ease;
}
#fog-container.visible { opacity: 1; }
.fog-layer {
  position: absolute;
  left: -100%;
  width: 300%;
  height: 120px;
  border-radius: 50%;
  background: rgba(200,205,215,0.35);
  filter: blur(20px);
  animation: fogDrift linear infinite alternate;
}
@keyframes fogDrift {
  0%   { transform: translateX(0) scaleY(1); }
  100% { transform: translateX(15%) scaleY(1.2); }
}

/* ── WEATHER BADGE ── */
#weather-badge {
  position: fixed;
  top: 60px;
  left: 16px;
  z-index: 60;
  background: rgba(12,12,22,0.75);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 0.78rem;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.1);
  opacity: 0;
  transition: opacity 1s ease;
  pointer-events: none;
}
#weather-badge.visible { opacity: 1; }

/* ══════════════════════════════════════
   BUS ANIMATION
══════════════════════════════════════ */
#bus-scene {
  position: fixed;
  bottom: 105px;
  left: 0;
  width: 100%;
  height: 130px;
  z-index: 3;
  pointer-events: none;
  overflow: visible;
}

#bus-wrapper {
  position: absolute;
  bottom: 0;
  left: -280px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  animation: busDrive 28s linear infinite;
}
@keyframes busDrive {
  0%   { left: -280px; }
  100% { left: calc(100vw + 30px); }
}

/* Bus body — pure CSS hill bus */
#bus-body {
  position: relative;
  width: 240px;
  height: 90px;
}

/* Main chassis */
.bus-chassis {
  position: absolute;
  bottom: 18px;
  left: 0;
  width: 240px;
  height: 60px;
  background: linear-gradient(180deg, #e53935 0%, #c62828 60%, #b71c1c 100%);
  border-radius: 8px 12px 4px 4px;
  box-shadow: inset 0 -3px 8px rgba(0,0,0,0.3), 2px 2px 8px rgba(0,0,0,0.4);
}

/* Yellow stripe */
.bus-stripe {
  position: absolute;
  bottom: 36px;
  left: 0;
  width: 240px;
  height: 14px;
  background: linear-gradient(180deg, #fdd835, #f9a825);
}

/* Windows row */
.bus-windows {
  position: absolute;
  top: 6px;
  left: 16px;
  display: flex;
  gap: 5px;
}
.bus-win {
  width: 24px;
  height: 20px;
  background: linear-gradient(135deg, rgba(150,210,255,0.85), rgba(100,170,220,0.6));
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 3px 3px 2px 2px;
  position: relative;
  overflow: hidden;
}
.bus-win::after {
  content: '';
  position: absolute;
  top: 2px; left: 3px;
  width: 40%;
  height: 60%;
  background: rgba(255,255,255,0.4);
  border-radius: 1px;
}

/* Windshield */
.bus-windshield {
  position: absolute;
  top: 6px;
  right: 8px;
  width: 34px;
  height: 24px;
  background: linear-gradient(135deg, rgba(150,210,255,0.9), rgba(80,150,200,0.7));
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 4px 8px 2px 2px;
}

/* Headlight */
.bus-headlight {
  position: absolute;
  bottom: 22px;
  right: 4px;
  width: 10px;
  height: 8px;
  background: #fff9c4;
  border-radius: 2px;
  box-shadow: 0 0 8px 4px rgba(255,250,150,0.6);
  animation: headlightFlicker 3s ease-in-out infinite;
}
@keyframes headlightFlicker {
  0%,90%,100% { opacity: 1; }
  92%          { opacity: 0.7; }
  95%          { opacity: 1; }
}

/* Wheels */
.bus-wheel {
  position: absolute;
  bottom: 2px;
  width: 28px;
  height: 28px;
  background: radial-gradient(circle at 35% 35%, #555, #111);
  border-radius: 50%;
  border: 3px solid #333;
  box-shadow: inset 0 0 6px rgba(255,255,255,0.1);
  animation: wheelSpin 0.6s linear infinite;
}
.bus-wheel::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);

.puff:nth-child(2) { width: 18px; height: 18px; animation-delay: 0.4s; }
.puff:nth-child(3) { width: 10px; height: 10px; animation-delay: 0.8s; }

  100% { opacity: 0;   transform: translate(-30px, -20px) scale(2); }

#bus-body {

  to   { transform: translateY(-3px); }

  overflow: hidden;
}

  content: '';
  position: absolute;
  top: 50%;
  left: -100%;
  width: 300%;
  height: 3px;
  background: repeating-linear-gradient(
    90deg,
    #fdd835 0px, #fdd835 30px,
    transparent 30px, transparent 60px
  );
  transform: translateY(-50%);
  animation: roadScroll 1.5s linear infinite;
}
@keyframes roadScroll {
  from { transform: translateY(-50%) translateX(0); }
  to   { transform: translateY(-50%) translateX(60px); }
}

/* ── Flags ── */
(function buildFlags() {
  const wrap = document.getElementById('flags-wrap');
  const colors = ['#e53935','#fdd835','#43a047','#1e88e5','#f5f5f5'];
  const count = 80;
  let html = '';
  for (let i = 0; i < count; i++) {
    const c = colors[i % colors.length];
    html += `<div class="flag" style="border-top-color:${c}"></div>`;
  }
  // duplicate for seamless loop
  wrap.innerHTML = html + html;
})();

/* ── Clock ── */
(function tickClock() {
  function update() {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes();
    const ap = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    document.getElementById('clock').textContent =
      `${h}:${String(m).padStart(2,'0')} ${ap}`;
  }
  update();
  setInterval(update, 10000);
})();

/* ── YT Player State ── */

let queueItems = [];   // {video_id, title}
let currentIndex = 0;
const titleCache = {};

/* ── Load YT API ── */
const ytTag = document.createElement('script');
ytTag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytTag);

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    width: '1',
    height: '1',
    playerVars: {
      autoplay: 0,
      controls: 0,
      rel: 0,
      playsinline: 1,
      enablejsapi: 1,
      origin: window.location.origin
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}

function onPlayerReady() {
  playerReady = true;
  ytPlayer.setVolume(80);
  // Load playlist first with index 0 so we can get total count, then jump to random
  ytPlayer.loadPlaylist({ listType: 'playlist', list: currentPlaylistId, index: 0 });
  // Wait for playlist to load, then pick a random track
  let attempts = 0;
  const pickRandom = setInterval(() => {
    attempts++;
    try {
      const list = ytPlayer.getPlaylist();
      if (list && list.length > 0) {
        clearInterval(pickRandom);
        const randomIdx = Math.floor(Math.random() * list.length);
        ytPlayer.playVideoAt(randomIdx);
        currentIndex = randomIdx;
      } else if (attempts > 20) {
        clearInterval(pickRandom);
        ytPlayer.playVideo();
      }
    } catch(e) { clearInterval(pickRandom); }
  }, 300);
}

function onPlayerStateChange(e) {
  const S = YT.PlayerState;
  if (e.data === S.PLAYING) {
    setPlayIcon('⏸');
    document.getElementById('thumb').classList.add('spin');
    document.getElementById('play-btn').classList.remove('buffering');
    startProgressTimer();
    refreshCurrentTrackInfo();
    isPlaying = true;
    document.getElementById('eq-bars').classList.add('playing');
    currentIndex = ytPlayer.getPlaylistIndex() || 0;
    highlightQueueItem(currentIndex);
  } else if (e.data === S.PAUSED) {
    setPlayIcon('▶');
    document.getElementById('thumb').classList.remove('spin');
    stopProgressTimer();
    isPlaying = false;
    document.getElementById('eq-bars').classList.remove('playing');
  } else if (e.data === S.BUFFERING) {
    document.getElementById('play-btn').classList.add('buffering');
  } else if (e.data === S.ENDED) {
    if (isRepeat) {
      ytPlayer.seekTo(0, true);
      ytPlayer.playVideo();
    } else {
      ytPlayer.nextVideo();
    }
  } else if (e.data === S.CUED) {
    document.getElementById('play-btn').classList.remove('buffering');
    refreshCurrentTrackInfo();
  }
}

function onPlayerError() {
  setTimeout(() => { if (playerReady) ytPlayer.nextVideo(); }, 1500);
}

/* ── Track Info ── */
function refreshCurrentTrackInfo() {
  if (!playerReady || !ytPlayer) return;
  try {
    const data = ytPlayer.getVideoData();
    if (data && data.title) {
      document.getElementById('track-name').textContent = data.title;
      document.getElementById('channel-name').textContent = data.author || currentPlaylistName;
    }
    if (data && data.video_id) {
      document.getElementById('thumb').src =
        `https://i.ytimg.com/vi/${data.video_id}/mqdefault.jpg`;
    }
    if (data && data.title && data.video_id) {
      addToHistory(data.title, data.author || currentPlaylistName, data.video_id);
    }
  } catch(e) {}
}

/* ── Progress Timer ── */
function startProgressTimer() {
  stopProgressTimer();
  progressTimer = setInterval(updateProgress, 500);
}
function stopProgressTimer() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
}
function updateProgress() {
  if (!playerReady || !ytPlayer) return;
  try {
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    const pct = dur > 0 ? (cur / dur) * 100 : 0;
    document.getElementById('progress').value = pct;
    document.getElementById('time-cur').textContent = fmtTime(cur);
    document.getElementById('time-dur').textContent = fmtTime(dur);
  } catch(e) {}
}
function fmtTime(s) {
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

/* ── Seek ── */
function onSeek(val) {
  if (!playerReady || !ytPlayer) return;
  try {
    const dur = ytPlayer.getDuration() || 0;
    const newTime = (val / 100) * dur;
    ytPlayer.seekTo(newTime, true);
    broadcastState('seek', { currentTime: newTime });
  } catch(e) {}
}

/* ── Volume ── */
function onVolume(val) {
  if (!playerReady || !ytPlayer) return;
  try {
    ytPlayer.setVolume(Number(val));
    if (Number(val) === 0) {
      document.getElementById('mute-btn').textContent = '🔇';
    } else {
      document.getElementById('mute-btn').textContent = '🔊';
    }
  } catch(e) {}
}
function toggleMute() {
  if (!playerReady || !ytPlayer) return;
  try {
    isMuted = !isMuted;
    if (isMuted) {
      ytPlayer.mute();
      document.getElementById('mute-btn').textContent = '🔇';
    } else {
      ytPlayer.unMute();
      document.getElementById('mute-btn').textContent = '🔊';
    }
  } catch(e) {}
}

/* ── Play Controls ── */
function togglePlay() {
  if (!playerReady || !ytPlayer) return;
  try {
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      ytPlayer.pauseVideo();
      broadcastState('pause', { currentTime: ytPlayer.getCurrentTime() });
    } else {
      ytPlayer.playVideo();
      broadcastState('play', { currentTime: ytPlayer.getCurrentTime() });
    }
  } catch(e) {}
}
function prevTrack() {
  if (!playerReady || !ytPlayer) return;
  try { ytPlayer.previousVideo(); broadcastState('prev'); } catch(e) {}
}
function nextTrack() {
  if (!playerReady || !ytPlayer) return;
  try { ytPlayer.nextVideo(); broadcastState('next'); } catch(e) {}
}
function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
  if (playerReady && ytPlayer) {
    try { ytPlayer.setShuffle(isShuffle); } catch(e) {}
  }
}
function toggleRepeat() {
  isRepeat = !isRepeat;
  document.getElementById('repeat-btn').classList.toggle('active', isRepeat);
  if (playerReady && ytPlayer) {
    try { ytPlayer.setLoop(isRepeat); } catch(e) {}
  }
}

function setPlayIcon(icon) {
  const btn = document.getElementById('play-btn');
  btn.querySelector('.btn-icon').textContent = icon;
}

/* ── Playlist Switch ── */
function switchPlaylist(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPlaylistId   = btn.dataset.id;
  currentPlaylistName = btn.dataset.name;

  document.getElementById('track-name').textContent = 'Loading…';
  document.getElementById('channel-name').textContent = currentPlaylistName;
  document.getElementById('progress').value = 0;
  document.getElementById('time-cur').textContent = '0:00';
  document.getElementById('time-dur').textContent = '0:00';
  stopProgressTimer();
  setPlayIcon('▶');
  document.getElementById('thumb').classList.remove('spin');
  isPlaying = false;
  queueItems = [];
  document.getElementById('queue-list').innerHTML =
    '<div style="color:#888;padding:16px;text-align:center">Loading queue…</div>';

  if (playerReady && ytPlayer) {
    try {
      ytPlayer.cuePlaylist({ listType: 'playlist', list: currentPlaylistId, index: 0 });
      setTimeout(() => {
        refreshCurrentTrackInfo();
        buildQueue();
      }, 1800);
    } catch(e) {}
  }
}

/* ── Queue ── */
function toggleQueue() {
  queueOpen = !queueOpen;
  const panel = document.getElementById('queue-panel');
  panel.classList.toggle('open', queueOpen);
  document.getElementById('queue-btn').classList.toggle('active', queueOpen);
  if (queueOpen && queueItems.length === 0) buildQueue();
}

// Close queue when clicking/touching anywhere outside it
function closeQueueOnOutsideClick(e) {
  if (!queueOpen) return;
  const panel = document.getElementById('queue-panel');
  const qBtn  = document.getElementById('queue-btn');
  if (!panel.contains(e.target) && !qBtn.contains(e.target)) {
    queueOpen = false;
    panel.classList.remove('open');
    qBtn.classList.remove('active');
  }
}
document.addEventListener('click', closeQueueOnOutsideClick);
document.addEventListener('touchend', closeQueueOnOutsideClick, { passive: true });

function buildQueue() {
  const panel = document.getElementById('queue-list');
  panel.innerHTML = '<div style="color:#888;padding:16px;text-align:center">Loading…</div>';

  if (!playerReady || !ytPlayer) return;
  try {
    const list = ytPlayer.getPlaylist();
    if (!list || list.length === 0) {
      panel.innerHTML = '<div style="color:#888;padding:16px;text-align:center">No tracks loaded yet.</div>';
      return;
    }
    queueItems = list.map(id => ({ video_id: id, title: titleCache[id] || null }));
    renderQueue();
    fetchTitlesInBatches(list);
  } catch(e) {
    panel.innerHTML = '<div style="color:#888;padding:16px;text-align:center">Queue unavailable.</div>';
  }
}

function renderQueue() {
  const panel = document.getElementById('queue-list');
  if (queueItems.length === 0) {
    panel.innerHTML = '<div style="color:#888;padding:16px;text-align:center">Empty queue.</div>';
    return;
  }
  panel.innerHTML = queueItems.map((item, i) => `
    <div class="queue-item${i === currentIndex ? ' playing' : ''}"
         onclick="playQueueItem(${i})">
      <span class="queue-num">${i + 1}</span>
      <img class="queue-thumb"
           src="https://i.ytimg.com/vi/${item.video_id}/default.jpg"
           alt="" loading="lazy">
      <span class="queue-title">${item.title || '<em style="color:#666">Loading…</em>'}</span>
    </div>
  `).join('');
}

function highlightQueueItem(idx) {
  currentIndex = idx;
  document.querySelectorAll('.queue-item').forEach((el, i) => {
    el.classList.toggle('playing', i === idx);
  });
}

function playQueueItem(idx) {
  if (!playerReady || !ytPlayer) return;
  try {
    ytPlayer.playVideoAt(idx);
    currentIndex = idx;
    highlightQueueItem(idx);
    broadcastState('trackChange', { trackIndex: idx });
  } catch(e) {}
}

async function fetchTitlesInBatches(ids) {
  const BATCH = 5;
  for (let i = 0; i < ids.length; i += BATCH) {
    const batch = ids.slice(i, i + BATCH);
    await Promise.all(batch.map(async (id) => {
      if (titleCache[id]) return;
      try {
        const res = await fetch(
          `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`
        );
        const json = await res.json();
        if (json && json.title) {
          titleCache[id] = json.title;
          const idx = queueItems.findIndex(q => q.video_id === id);
          if (idx !== -1) queueItems[idx].title = json.title;
        }
      } catch(e) {}
    }));
    renderQueue();
    await new Promise(r => setTimeout(r, 200));
  }
}

/* ════════════════════════════════════════════
   JAM SESSION — Firebase Realtime Sync
   ════════════════════════════════════════════
   SETUP: Replace the firebaseConfig below with
   your own from https://console.firebase.google.com
   → Create project → Add web app → Copy config
   → Realtime Database → Create database (test mode)
   ============================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDEMO_REPLACE_WITH_YOUR_KEY",
  authDomain: "your-project.firebaseapp.com",
  databaseURL: "https://your-project-default-rtdb.firebaseio.com",
  projectId: "your-project-id",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:demo"
};

let jamDb = null;
let jamSessionId = null;
let jamRef = null;
let jamPresenceRef = null;
let isJamActive = false;
let isSyncing = false; // prevent feedback loops
let localUserId = 'user_' + Math.random().toString(36).substr(2, 8);

function initFirebase() {
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    jamDb = firebase.database();
    return true;
  } catch(e) {
    console.warn('Firebase init failed:', e);
    return false;
  }
}

function generateSessionId() {
  return Math.random().toString(36).substr(2, 8).toUpperCase();
}

function openJamModal() {
  // Check if already in a session via URL param
  const params = new URLSearchParams(window.location.search);
  const existingId = params.get('jam');

  if (!jamSessionId) {
    jamSessionId = existingId || generateSessionId();
  }

  const jamUrl = `${window.location.origin}${window.location.pathname}?jam=${jamSessionId}`;
  document.getElementById('jam-link-box').textContent = jamUrl;
  document.getElementById('jam-modal').classList.add('open');

  // Start session if not already active
  if (!isJamActive) startJamSession(jamSessionId);
}

function closeJamModal() {
  document.getElementById('jam-modal').classList.remove('open');
}

function copyJamLink() {
  const params = new URLSearchParams(window.location.search);
  const id = jamSessionId || params.get('jam');
  if (!id) return;
  const url = `${window.location.origin}${window.location.pathname}?jam=${id}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('jam-copy-btn');
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = '📋 Copy Link'; }, 2000);
  }).catch(() => {
    document.getElementById('jam-link-box').select?.();
  });
}

function startJamSession(sessionId) {
  if (!initFirebase()) {
    alert('⚠️ Firebase not configured yet.\n\nTo enable Jam sessions:\n1. Go to console.firebase.google.com\n2. Create a free project\n3. Add a web app\n4. Enable Realtime Database\n5. Paste your config in the code');
    return;
  }

  jamSessionId = sessionId;
  isJamActive = true;

  // Update URL without reload
  const newUrl = `${window.location.origin}${window.location.pathname}?jam=${sessionId}`;
  window.history.replaceState({}, '', newUrl);

  // Update modal link
  document.getElementById('jam-link-box').textContent = newUrl;

  jamRef = jamDb.ref(`jam/${sessionId}/state`);
  jamPresenceRef = jamDb.ref(`jam/${sessionId}/presence/${localUserId}`);

  // Set presence
  jamPresenceRef.set({ online: true, joinedAt: Date.now() });
  jamPresenceRef.onDisconnect().remove();

  // Watch presence count
  jamDb.ref(`jam/${sessionId}/presence`).on('value', snap => {
    const count = snap.numChildren();
    document.getElementById('jam-status-text').textContent = `Jam • ${count} listening`;
    document.getElementById('jam-status').classList.toggle('visible', count > 0);
  });

  // Listen for remote state changes
  jamRef.on('value', snap => {
    const state = snap.val();
    if (!state) return;
    if (state.updatedBy === localUserId) return; // ignore our own updates
    applyRemoteState(state);
  });

  // Mark jam button active
  document.getElementById('jam-btn').classList.add('active');
  document.getElementById('jam-btn').textContent = '🎸 In Jam';
  document.getElementById('jam-status').classList.add('visible');
}

function broadcastState(action, extra) {
  if (!isJamActive || !jamRef || isSyncing) return;
  try {
    const state = {
      action,
      playlistId: currentPlaylistId,
      playlistName: currentPlaylistName,
      trackIndex: playerReady ? (ytPlayer.getPlaylistIndex() || 0) : 0,
      currentTime: playerReady ? (ytPlayer.getCurrentTime() || 0) : 0,
      updatedBy: localUserId,
      updatedAt: Date.now(),
      ...extra
    };
    jamRef.set(state);
  } catch(e) {}
}

function applyRemoteState(state) {
  if (!playerReady || !ytPlayer) return;
  isSyncing = true;
  try {
    // If playlist changed, switch it first
    if (state.playlistId && state.playlistId !== currentPlaylistId) {
      const tabBtn = document.querySelector(`.tab-btn[data-id="${state.playlistId}"]`);
      if (tabBtn) {
        switchPlaylist(tabBtn);
        // After switching, seek and play once loaded
        setTimeout(() => {
          applyRemotePlayback(state);
        }, 2000);
        return;
      }
    }
    applyRemotePlayback(state);
  } catch(e) {}
  setTimeout(() => { isSyncing = false; }, 500);
}

function applyRemotePlayback(state) {
  try {
    if (state.action === 'play') {
      if (state.trackIndex !== undefined) {
        const curIdx = ytPlayer.getPlaylistIndex();
        if (curIdx !== state.trackIndex) {
          ytPlayer.playVideoAt(state.trackIndex);
        } else {
          if (state.currentTime && Math.abs(ytPlayer.getCurrentTime() - state.currentTime) > 2) {
            ytPlayer.seekTo(state.currentTime, true);
          }
          ytPlayer.playVideo();
        }
      } else {
        ytPlayer.playVideo();
      }
    } else if (state.action === 'pause') {
      ytPlayer.pauseVideo();
      if (state.currentTime) ytPlayer.seekTo(state.currentTime, true);
    } else if (state.action === 'seek') {
      if (state.currentTime !== undefined) ytPlayer.seekTo(state.currentTime, true);
    } else if (state.action === 'next') {
      ytPlayer.nextVideo();
    } else if (state.action === 'prev') {
      ytPlayer.previousVideo();
    } else if (state.action === 'trackChange') {
      if (state.trackIndex !== undefined) ytPlayer.playVideoAt(state.trackIndex);
    }
  } catch(e) {}
  setTimeout(() => { isSyncing = false; }, 500);
}

// Auto-join session from URL on page load
(function autoJoinJam() {
  const params = new URLSearchParams(window.location.search);
  const jamId = params.get('jam');
  if (jamId) {
    // Wait for player to be ready before joining
    const waitForPlayer = setInterval(() => {
      if (playerReady) {
        clearInterval(waitForPlayer);
        startJamSession(jamId);
        // Show a toast notification
        showJamToast('🎸 Joined Jam session!');
      }
    }, 500);
  }
})();

function showJamToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed;top:60px;left:50%;transform:translateX(-50%);
    background:rgba(18,18,28,0.95);color:#ffd54f;padding:10px 20px;
    border-radius:999px;font-size:0.88rem;font-weight:600;z-index:400;
    border:1px solid rgba(255,180,0,0.4);backdrop-filter:blur(10px);
    animation:fadeInOut 3s ease forwards;pointer-events:none;
  `;
  toast.textContent = msg;
  if (!document.getElementById('toast-style')) {
    const s = document.createElement('style');
    s.id = 'toast-style';
    s.textContent = '@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}';
    document.head.appendChild(s);
  }
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3100);
}

/* ════════════════════════════════════════════
   LIVE WEATHER — Uttarkashi via Open-Meteo
   Lat: 30.7268, Lon: 78.4354
   Refreshes every 10 minutes
   ════════════════════════════════════════════ */

const UTTARKASHI = { lat: 30.7268, lon: 78.4354 };
let currentWeatherType = 'sunny';
let lightningTimer = null;

// WMO Weather code → our type
function wmoToType(code) {
  if (code === 0)                    return 'sunny';
  if (code <= 2)                     return 'sunny';
  if (code === 3)                    return 'cloudy';
  if (code >= 45 && code <= 48)      return 'foggy';
  if (code >= 51 && code <= 67)      return 'rainy';
  if (code >= 71 && code <= 77)      return 'snowy';
  if (code >= 80 && code <= 82)      return 'rainy';
  if (code >= 85 && code <= 86)      return 'snowy';
  if (code >= 95 && code <= 99)      return 'thunder';
  return 'cloudy';
}

function weatherEmoji(type) {
  return { sunny:'☀️', cloudy:'⛅', rainy:'🌧', thunder:'⛈', foggy:'🌫', snowy:'❄️' }[type] || '🌤';
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${UTTARKASHI.lat}&longitude=${UTTARKASHI.lon}&current=weathercode,temperature_2m&timezone=Asia%2FKolkata`;
    const res = await fetch(url);
    const data = await res.json();
    const code = data.current.weathercode;
    const temp = Math.round(data.current.temperature_2m);
    const type = wmoToType(code);
    const badge = document.getElementById('weather-badge');
    badge.textContent = `${weatherEmoji(type)} Uttarkashi ${temp}°C`;
    badge.classList.add('visible');
    applyWeather(type);
  } catch(e) {
    // Fallback to cloudy/rainy (typical Uttarkashi monsoon)
    applyWeather('rainy');
  }
}

function applyWeather(type) {
  if (type === currentWeatherType) return;
  currentWeatherType = type;

  const scene = document.getElementById('weather-scene');

  // Remove all weather classes
  scene.className = '';
  scene.classList.add(type);

  // Sun
  const sun = document.getElementById('sun');
  sun.classList.toggle('visible', type === 'sunny');

  // Clouds
  document.querySelectorAll('.cloud').forEach(c => c.remove());
  if (type === 'cloudy' || type === 'rainy' || type === 'thunder') {
    buildClouds(type);
  }

  // Rain
  const rain = document.getElementById('rain-container');
  rain.innerHTML = '';
  rain.classList.toggle('visible', type === 'rainy' || type === 'thunder');
  if (type === 'rainy' || type === 'thunder') buildRain(type === 'thunder' ? 180 : 100);

  // Snow
  const snow = document.getElementById('snow-container');
  snow.innerHTML = '';
  snow.classList.toggle('visible', type === 'snowy');
  if (type === 'snowy') buildSnow();

  // Fog
  const fog = document.getElementById('fog-container');
  fog.innerHTML = '';
  fog.classList.toggle('visible', type === 'foggy');
  if (type === 'foggy') buildFog();

  // Lightning
  if (lightningTimer) clearInterval(lightningTimer);
  if (type === 'thunder') {
    lightningTimer = setInterval(flashLightning, 4000 + Math.random() * 6000);
  }
}

function buildClouds(type) {
  const scene = document.getElementById('weather-scene');
  const isDark = type === 'rainy' || type === 'thunder';
  const configs = [
    { top:'6%',  w:180, h:55,  dur:45, delay:0 },
    { top:'12%', w:240, h:70,  dur:60, delay:-20 },
    { top:'4%',  w:140, h:45,  dur:38, delay:-10 },
    { top:'18%', w:200, h:60,  dur:52, delay:-35 },
    { top:'8%',  w:160, h:50,  dur:42, delay:-5  },
  ];
  configs.forEach(cfg => {
    const c = document.createElement('div');
    c.className = 'cloud' + (isDark ? ' dark' : '') + ' visible';
    c.style.cssText = `top:${cfg.top};width:${cfg.w}px;height:${cfg.h}px;
      left:-${cfg.w+20}px;
      animation-duration:${cfg.dur}s;
      animation-delay:${cfg.delay}s;`;
    c.style.setProperty('--cloud-end', `calc(100vw + ${cfg.w+40}px)`);
    c.style.cssText += `animation-name:cloudDrift;animation-timing-function:linear;animation-iteration-count:infinite;`;
    // reposition start so animation flows properly
    c.style.left = `${Math.random() * 100}vw`;
    scene.appendChild(c);
    requestAnimationFrame(() => c.classList.add('visible'));
  });
}

function buildRain(count) {
  const container = document.getElementById('rain-container');
  for (let i = 0; i < count; i++) {
    const drop = document.createElement('div');
    drop.className = 'raindrop';
    const height = 12 + Math.random() * 20;
    drop.style.cssText = `
      left:${Math.random() * 100}%;
      height:${height}px;
      animation-duration:${0.5 + Math.random() * 0.6}s;
      animation-delay:${Math.random() * -2}s;
      opacity:${0.5 + Math.random() * 0.5};
    `;
    container.appendChild(drop);
  }
}

/* ── PARALLAX MOUNTAINS ── */
(function initParallax() {
  const far  = document.getElementById('mtn-far');
  const mid  = document.getElementById('mtn-mid');
  const near = document.getElementById('mtn-near');
  if (!far) return;
  document.addEventListener('mousemove', (e) => {
    const cx = (e.clientX / window.innerWidth - 0.5);
    far.style.transform  = `translateX(${cx * -15}px)`;
    mid.style.transform  = `translateX(${cx * -30}px)`;
    near.style.transform = `translateX(${cx * -50}px)`;
  });
  // Gyroscope for mobile
  window.addEventListener('deviceorientation', (e) => {
    if (e.gamma == null) return;
    const g = Math.max(-30, Math.min(30, e.gamma)) / 30;
    far.style.transform  = `translateX(${g * -15}px)`;
    mid.style.transform  = `translateX(${g * -30}px)`;
    near.style.transform = `translateX(${g * -50}px)`;
  });
})();

/* ── DAY/NIGHT CYCLE (Uttarkashi time = IST = UTC+5:30) ── */
(function initDayNight() {
  const skyEl   = document.getElementById('sky-overlay');
  const starsEl = document.getElementById('stars-night');
  if (!skyEl) return;

  // Build stars
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star-dot';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*70}%;left:${Math.random()*100}%;--tw-dur:${(Math.random()*3+1.5).toFixed(1)}s;--tw-min:${(Math.random()*0.3+0.1).toFixed(2)};animation-delay:${(Math.random()*4).toFixed(1)}s;`;
    starsEl.appendChild(s);
  }

  function applyTime() {
    // Get IST hour
    const now = new Date();
    const istH = (now.getUTCHours() + 5) % 24 + (now.getUTCMinutes() >= 30 ? 0.5 : 0);

    let sky = '', starOp = 0;

    if (istH >= 5 && istH < 7) {         // Dawn
      sky = 'linear-gradient(180deg,rgba(255,120,60,0.35) 0%,rgba(255,200,100,0.2) 50%,transparent 100%)';
    } else if (istH >= 7 && istH < 17) { // Day
      sky = 'linear-gradient(180deg,rgba(100,180,255,0.1) 0%,transparent 60%)';
      starOp = 0;
    } else if (istH >= 17 && istH < 19) { // Dusk
      sky = 'linear-gradient(180deg,rgba(255,80,20,0.4) 0%,rgba(200,80,150,0.2) 60%,transparent 100%)';
      starOp = 0.2;
    } else if (istH >= 19 && istH < 21) { // Evening
      sky = 'linear-gradient(180deg,rgba(30,20,80,0.65) 0%,rgba(60,30,100,0.3) 100%)';
      starOp = 0.7;
    } else {                              // Night
      sky = 'linear-gradient(180deg,rgba(5,5,30,0.82) 0%,rgba(10,10,50,0.5) 100%)';
      starOp = 1;
    }
    skyEl.style.background = sky;
    starsEl.style.opacity = starOp;
  }

  applyTime();
  setInterval(applyTime, 60 * 1000); // update every minute
})();

/* ── BUS HORN ── */
let hornCtx = null;
function getHornCtx() {
  if (!hornCtx) hornCtx = new (window.AudioContext || window.webkitAudioContext)();
  return hornCtx;
}

function honkHorn() {
  // Web Audio horn sound
  try {
    const ctx = getHornCtx();
    const masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.05);
    masterGain.gain.setValueAtTime(0.6, ctx.currentTime + 0.3);
    masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    masterGain.connect(ctx.destination);

    // Two oscillators for a rich horn chord
    [220, 277].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(freq * 1.02, ctx.currentTime + 0.3);
      g.gain.value = i === 0 ? 0.6 : 0.4;
      osc.connect(g);
      g.connect(masterGain);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.65);
    });
  } catch(e) {}

  // Dust cloud effect
  const btn = document.getElementById('horn-btn');
  const rect = btn.getBoundingClientRect();
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'dust-puff';
    const sz = 30 + Math.random() * 40;
    d.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${rect.left + rect.width/2 - sz/2 + (Math.random()-0.5)*60}px;
      top:${rect.top + rect.height/2 - sz/2 + (Math.random()-0.5)*60}px;
      animation-delay:${Math.random()*0.2}s;
    `;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1100);
  }

  showJamToast('📯 PAAAAN PAAAN!');
}

/* ── SONG HISTORY ── */
const songHistory = [];
let historyOpen = false;

function addToHistory(title, author, videoId) {
  if (!title || title === '—' || title === 'Select a playlist to begin') return;
  // Don't add duplicate of last entry
  if (songHistory.length > 0 && songHistory[0].title === title) return;
  const now = new Date();
  const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  songHistory.unshift({ title, author, videoId, time: timeStr });
  if (songHistory.length > 10) songHistory.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!list) return;
  if (songHistory.length === 0) {
    list.innerHTML = '<div style="color:#666;padding:16px;text-align:center;font-size:0.8rem">No history yet</div>';
    return;
  }
  list.innerHTML = songHistory.map(item => `
    <div class="hist-item">
      <img class="hist-thumb" src="https://i.ytimg.com/vi/${item.videoId}/default.jpg" alt="">
      <div class="hist-info">
        <div class="hist-title">${item.title}</div>
        <div class="hist-time">${item.author} · ${item.time}</div>
      </div>
    </div>
  `).join('');
}

function toggleHistory() {
  historyOpen = !historyOpen;
  document.getElementById('history-panel').classList.toggle('open', historyOpen);
  document.getElementById('history-btn').classList.toggle('active', historyOpen);
}

// Close history on outside click
document.addEventListener('click', (e) => {
  if (!historyOpen) return;
  const panel = document.getElementById('history-panel');
  const btn   = document.getElementById('history-btn');
  if (panel && btn && !panel.contains(e.target) && !btn.contains(e.target)) {
    historyOpen = false;
    panel.classList.remove('open');
    btn.classList.remove('active');
  }
});

/* ── SLEEP TIMER ── */
let sleepTimerEnd = null;
let sleepInterval = null;
let sleepMenuOpen = false;

function toggleSleepMenu() {
  sleepMenuOpen = !sleepMenuOpen;
  document.getElementById('sleep-menu').classList.toggle('open', sleepMenuOpen);
}

function setSleepTimer(minutes) {
  sleepMenuOpen = false;
  document.getElementById('sleep-menu').classList.remove('open');
  const btn = document.getElementById('sleep-btn');
  const cd  = document.getElementById('sleep-countdown');

  if (sleepInterval) clearInterval(sleepInterval);

  if (minutes === 0) {
    sleepTimerEnd = null;
    btn.classList.remove('active');
    cd.style.display = 'none';
    showJamToast('😴 Sleep timer cancelled');
    return;
  }

  sleepTimerEnd = Date.now() + minutes * 60 * 1000;
  btn.classList.add('active');
  cd.style.display = 'block';

  showJamToast(`😴 Pausing in ${minutes} min`);

  sleepInterval = setInterval(() => {
    const remaining = sleepTimerEnd - Date.now();
    if (remaining <= 0) {
      clearInterval(sleepInterval);
      if (playerReady && ytPlayer) ytPlayer.pauseVideo();
      btn.classList.remove('active');
      cd.style.display = 'none';
      sleepTimerEnd = null;
      showJamToast('😴 Sweet dreams! Music paused.');
      return;
    }
    const mins = Math.ceil(remaining / 60000);
    cd.textContent = mins < 60 ? `${mins}m` : '1h';
  }, 10000);
}

// Close sleep menu on outside click
document.addEventListener('click', (e) => {
  if (!sleepMenuOpen) return;
  const menu = document.getElementById('sleep-menu');
  const btn  = document.getElementById('sleep-btn');
  if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
    sleepMenuOpen = false;
    menu.classList.remove('open');
  }
});

/* ── VISITOR COUNTER (global presence via Firebase) ── */
(function initVisitorCounter() {
  // We'll init this once Firebase is available
  const wait = setInterval(() => {
    if (typeof firebase === 'undefined') return;
    clearInterval(wait);
    try {
      // Use a separate config check — reuse existing jamDb if available, else init
      const doInit = () => {
        if (!jamDb) {
          try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            jamDb = firebase.database();
          } catch(e) { return; }
        }
        const visitorId = localUserId;
        const presRef = jamDb.ref(`global_presence/${visitorId}`);
        presRef.set({ t: Date.now() });
        presRef.onDisconnect().remove();

        jamDb.ref('global_presence').on('value', snap => {
          const count = snap.numChildren();
          const el = document.getElementById('visitor-count');
          if (!el) return;
          el.textContent = `🚌 ${count} on the bus`;
          el.classList.toggle('visible', count > 0);
        });
      };
      // Wait a moment for jamDb to potentially be initialized
      setTimeout(doInit, 2000);
    } catch(e) {}
  }, 500);
})();

/* ── EMOJI REACTIONS ── */
function spawnReaction(emoji, x, y) {
  const el = document.createElement('div');
  el.className = 'floating-reaction';
  el.textContent = emoji;
  const startX = x || (20 + Math.random() * (window.innerWidth - 40));
  const startY = y || (window.innerHeight - 260);
  el.style.cssText = `left:${startX}px;top:${startY}px;animation-delay:${Math.random()*0.3}s;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function sendReaction(emoji) {
  // Local spawn
  const bar = document.getElementById('reaction-bar');
  const rect = bar ? bar.getBoundingClientRect() : null;
  const x = rect ? rect.left + Math.random() * rect.width : null;
  spawnReaction(emoji, x, null);

  // Broadcast via Firebase if active
  if (jamDb) {
    try {
      jamDb.ref('reactions').push({ emoji, uid: localUserId, t: Date.now() });
    } catch(e) {}
  }
}

// Listen for remote reactions
(function listenReactions() {
  const wait = setInterval(() => {
    if (!jamDb) return;
    clearInterval(wait);
    try {
      jamDb.ref('reactions').limitToLast(1).on('child_added', snap => {
        const d = snap.val();
        if (!d || d.uid === localUserId) return;
        spawnReaction(d.emoji);
      });
    } catch(e) {}
  }, 3000);
})();

/* ── NOW PLAYING CARD ── */
async function generateNowPlayingCard() {
  const title   = document.getElementById('track-name').textContent || 'Unknown';
  const channel = document.getElementById('channel-name').textContent || '';
  const thumb   = document.getElementById('thumb');
  const weather = document.getElementById('weather-badge').textContent || '';

  const canvas = document.createElement('canvas');
  canvas.width  = 600;
  canvas.height = 300;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 600, 300);
  grad.addColorStop(0, '#0c0c16');
  grad.addColorStop(1, '#1a0a00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 600, 300);

  // Decorative stripe
  ctx.fillStyle = '#ffb300';
  ctx.fillRect(0, 0, 6, 300);

  // Album art circle
  try {
    if (thumb.src && !thumb.src.includes('default')) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((res, rej) => {
        img.onload = res; img.onerror = rej;
        img.src = thumb.src;
      });
      ctx.save();
      ctx.beginPath();
      ctx.arc(100, 150, 70, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, 30, 80, 140, 140);
      ctx.restore();
      // Circle border
      ctx.beginPath();
      ctx.arc(100, 150, 70, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffb300';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  } catch(e) {}

  // Track info
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px Segoe UI, Arial';
  // Truncate long titles
  const maxW = 370;
  let titleText = title;
  while (ctx.measureText(titleText).width > maxW && titleText.length > 10) {
    titleText = titleText.slice(0, -4) + '…';
  }
  ctx.fillText(titleText, 200, 130);

  ctx.fillStyle = '#aaaaaa';
  ctx.font = '16px Segoe UI, Arial';
  ctx.fillText(channel, 200, 160);

  ctx.fillStyle = '#ffd54f';
  ctx.font = '14px Segoe UI, Arial';
  ctx.fillText(weather, 200, 195);

  ctx.fillStyle = '#444';
  ctx.font = '13px Segoe UI, Arial';
  ctx.fillText('vishwanath-seva.vercel.app', 200, 240);

  // Logo text
  ctx.fillStyle = 'rgba(255,180,0,0.15)';
  ctx.font = 'bold 60px Segoe UI, Arial';
  ctx.fillText('🚌', 460, 220);

  // Download
  const link = document.createElement('a');
  link.download = `now-playing-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();

  showJamToast('🖼 Card downloaded!');
}
